name: Docker images

on:
  push:
    tags: ['v*']        # uniquement sur tag de release
  workflow_dispatch:    # ou déclenchement manuel depuis l'UI Actions

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build & push ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: web, context: ., dockerfile: docker/web/Dockerfile }
          # TODO : images postfix/dovecot/rspamd à valider end-to-end avant publication
          # (configs éprouvées en prod 149, mais Dockerfiles OSS pas encore testés
          # en stack docker-compose autonome). Réactiver une fois les smoke tests verts.
    steps:
      - uses: actions/checkout@v6

      - name: Setup QEMU (multi-arch)
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/noliae/noliae-mail-oss-${{ matrix.image.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
