name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-php:
    name: Lint PHP (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Cache composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-progress --prefer-dist --no-interaction
      - run: vendor/bin/pint --test

  test-php:
    name: PHPUnit
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:hpkP3kZGsiBKxBKQ8a7VqXkDjnYRZi4Hd6Q4Dz1qHZA=
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl, gd, zip, bcmath, sockets
          coverage: none
          tools: composer:v2
      - name: Cache composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-progress --prefer-dist --no-interaction
      - run: vendor/bin/phpunit --no-coverage

  build-assets:
    name: Build front (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Verify manifest
        run: test -f public/build/manifest.json
