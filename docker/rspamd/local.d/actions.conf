# Politique anti-spam Noliae Mail
# Le filtre rspamd note chaque message ; selon le score, on :
#   - rejette (>= 15)  : l'expediteur recoit un mail de rebond avec la raison
#   - reecrit l'objet (>= 10) avec [SPAM] pour signalisation visuelle
#   - ajoute un en-tete X-Spam (>= 6) : le client mail peut le filer en Indesirables
#   - greylist (>= 8)  : differe les premiers envois suspects
reject = {
    threshold = 15;
    message = "Message refuse par le filtre anti-spam Noliae Mail : votre message a ete identifie comme indesirable. Si vous pensez qu'il s'agit d'une erreur, repondez avec un contenu plus explicite ou contactez postmaster@noliae.net en joignant l'objet et la date de ce message. -- Noliae Mail";
}
rewrite_subject = 10;
add_header = 6;
greylist = 8;
