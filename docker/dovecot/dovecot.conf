## Dovecot OSS minimal — auth Postgres + Maildir, IMAP plaintext interne.
protocols = imap lmtp

# Auth via Postgres
disable_plaintext_auth = no
auth_mechanisms = plain login
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql-tokens.conf.ext
}
userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

# Stockage Maildir par user
mail_location = maildir:/var/vmail/%d/%n/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
first_valid_gid = 5000

# Services
service auth {
  unix_listener auth-userdb {
    user = vmail
  }
}
service auth {
  inet_listener {
    port = 12345
  }
}
service imap-login {
  inet_listener imap {
    port = 143
  }
}
service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

# Logs vers stderr
log_path = /dev/stderr
info_log_path = /dev/stderr
debug_log_path = /dev/stderr

# Namespace INBOX standard
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
}

# Master user pour le webmail (passwd-file géré par entrypoint)
auth_master_user_separator = *
passdb {
  driver = passwd-file
  master = yes
  args = /etc/dovecot/master-users
  result_success = continue-ok
}
