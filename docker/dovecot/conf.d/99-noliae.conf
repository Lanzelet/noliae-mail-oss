protocols = imap lmtp
disable_plaintext_auth = yes
auth_mechanisms = plain login

ssl = yes
ssl_cert = </etc/letsencrypt/live/smtp.noliae.net/fullchain.pem
ssl_key = </etc/letsencrypt/live/smtp.noliae.net/privkey.pem
ssl_min_protocol = TLSv1.2

mail_location = maildir:/var/mail/vhosts/%d/%n
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000
mail_plugins = $mail_plugins quota

namespace inbox {
  inbox = yes
}
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}
userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
  }
}
plugin {
  quota = maildir:User quota
  quota_rule = *:storage=5G
}
protocol lmtp {
  mail_plugins = $mail_plugins quota
}
protocol imap {
  mail_plugins = $mail_plugins quota imap_quota
}
