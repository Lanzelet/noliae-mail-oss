# Noliae Mail OSS — stack tout-en-un.
# Tout est containerisé : webmail + Postfix + Dovecot + rspamd + Postgres + Redis + MinIO (+ Traefik).
#
# Usage :
#   1. Copier .env.example en .env et remplir MAIL_DOMAIN, ADMIN_EMAIL, etc.
#   2. ./install.sh       (génère DKIM, crée le compte admin, affiche les records DNS)
#   3. docker compose up -d
#
# Pré-requis : ports 25/465/587/993/143/80/443 ouverts au public sur le host.
services:

  ##########################
  # 1. WEBMAIL (Laravel/Vue)
  ##########################
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    env_file: [.env]
    environment:
      APP_URL: https://${MAIL_DOMAIN}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_NAME:-noliaemail}
      DB_USERNAME: ${DB_USER:-noliae}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      MAIL_IMAP_HOST: dovecot
      MAIL_IMAP_PORT: 143
      MAIL_IMAP_ENCRYPTION: starttls
      MAIL_SMTP_HOST: postfix
      MAIL_SMTP_PORT: 25
      MAIL_MASTER_USER: ${MAIL_MASTER_USER:-masteruser}
      MAIL_MASTER_PASS: ${MAIL_MASTER_PASS}
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      MAIL_QUOTA_BYTES: ${MAIL_QUOTA_BYTES:-5368709120}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-noliae}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: attachments
      AWS_ENDPOINT: ${AWS_ENDPOINT:-https://s3.${MAIL_DOMAIN}}
      AWS_USE_PATH_STYLE_ENDPOINT: true
      SESSION_DRIVER: database
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      # Daemon Postfix queue (quarantaine spam / force-delivery)
      POSTFIX_QUEUE_HOST: postfix
      POSTFIX_QUEUE_PORT: 10032
      POSTFIX_QUEUE_TOKEN: ${POSTFIX_QUEUE_TOKEN}
      # Rspamd controller API
      RSPAMD_URL: http://rspamd:11334
      RSPAMD_PASSWORD: ${RSPAMD_PASSWORD:-}
    volumes:
      - web-storage:/var/www/html/storage
      # Lecture des clés DKIM publiques pour afficher le record TXT à publier
      # dans l'admin panel /admin/domains/{id}/dns.
      - postfix-dkim:/etc/opendkim/keys:ro
      - ./docker/web/scheduler.sh:/usr/local/bin/scheduler.sh:ro
    networks: [intnet]
    labels:
      - traefik.enable=true
      - traefik.http.routers.mail.rule=Host(`${MAIL_DOMAIN}`)
      - traefik.http.routers.mail.entrypoints=websecure
      - traefik.http.routers.mail.tls.certresolver=le
      - traefik.http.services.mail.loadbalancer.server.port=8080

  ##########################
  # 1bis. SCHEDULER (Laravel artisan schedule:run chaque minute)
  ##########################
  scheduler:
    # Reuse l'image PHP du service web (meme code, meme deps).
    # Docker BuildKit deduplique : pas de second build si web a deja ete build.
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy }, web: { condition: service_started } }
    env_file: [.env]
    environment:
      APP_URL: https://${MAIL_DOMAIN}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_NAME:-noliaemail}
      DB_USERNAME: ${DB_USER:-noliae}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      DEMO_RESET: ${DEMO_RESET:-false}
    volumes:
      - web-storage:/var/www/html/storage
      - vmail:/var/vmail
      - ./docker/web/scheduler.sh:/usr/local/bin/scheduler.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/scheduler.sh"]
    networks: [intnet]

  ##########################
  # 2. POSTGRES
  ##########################
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-noliaemail}
      POSTGRES_USER: ${DB_USER:-noliae}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-noliae}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [intnet]

  ##########################
  # 3. REDIS
  ##########################
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    networks: [intnet]

  ##########################
  # 4. MINIO (S3 pour pièces jointes)
  ##########################
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-noliae}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # CRUCIAL pour MinIO derrière Traefik : sans ça MinIO calcule la
      # signature S3 pour http://minio:9000 (vu en interne) au lieu de
      # l'URL publique. Conséquence : tous les presigned URLs renvoient
      # SignatureDoesNotMatch quand le browser tente d'y accéder.
      MINIO_SERVER_URL: ${AWS_ENDPOINT:-https://s3.${MAIL_DOMAIN}}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-https://s3.${MAIL_DOMAIN}:9001}
    volumes: [minio-data:/data]
    networks: [intnet]
    labels:
      # Expose MinIO publiquement (les URLs presignees sont signees pour
      # cet hostname-la, donc le navigateur doit pouvoir l'atteindre).
      - traefik.enable=true
      - traefik.http.routers.s3.rule=Host(`s3.${MAIL_DOMAIN}`)
      - traefik.http.routers.s3.entrypoints=websecure
      - traefik.http.routers.s3.tls.certresolver=le
      - traefik.http.services.s3.loadbalancer.server.port=9000

  # Crée le bucket "attachments" au démarrage
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set m http://minio:9000 \"${MINIO_ROOT_USER:-noliae}\" \"${MINIO_ROOT_PASSWORD}\"; do sleep 1; done;
             mc mb --ignore-existing m/attachments &&
             mc anonymous set none m/attachments"
    networks: [intnet]
    restart: "no"

  ##########################
  # 5. POSTFIX (MTA)
  ##########################
  postfix:
    build: ./docker/postfix
    restart: unless-stopped
    hostname: ${MAIL_DOMAIN}
    depends_on: [postgres, rspamd]
    env_file: [.env]
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      MAIL_TRUSTED_NETS: ${MAIL_TRUSTED_NETS:-127.0.0.0/8 [::1]/128 172.16.0.0/12}
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-noliaemail}
      DB_USER: ${DB_USER:-noliae}
      DB_PASSWORD: ${DB_PASSWORD}
      # Daemons Python policy/admin lancés en background par l'entrypoint.
      POSTFIX_QUEUE_TOKEN: ${POSTFIX_QUEUE_TOKEN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "25:25"      # MX entrant + relay
      - "465:465"    # Submissions (SMTPS)
      - "587:587"    # Submission (STARTTLS)
    volumes:
      - postfix-data:/var/spool/postfix
      - postfix-tls:/etc/letsencrypt
      # DKIM keys persistées entre rebuilds. Lecture aussi par le web container
      # pour afficher le record TXT à publier dans /admin/domains/{id}/dns.
      - postfix-dkim:/etc/opendkim/keys
    networks: [intnet]

  ##########################
  # 6. DOVECOT (IMAP/LMTP + Sieve)
  ##########################
  dovecot:
    build: ./docker/dovecot
    restart: unless-stopped
    hostname: ${MAIL_DOMAIN}
    depends_on: [postgres]
    env_file: [.env]
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-noliaemail}
      DB_USER: ${DB_USER:-noliae}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_MASTER_USER: ${MAIL_MASTER_USER:-masteruser}
      MAIL_MASTER_PASS: ${MAIL_MASTER_PASS}
    ports:
      - "143:143"    # IMAP STARTTLS
      - "993:993"    # IMAPS
    volumes:
      - vmail:/var/vmail
      - dovecot-tls:/etc/letsencrypt
    networks: [intnet]

  ##########################
  # 7. RSPAMD (antispam + DKIM signing)
  ##########################
  rspamd:
    build: ./docker/rspamd
    restart: unless-stopped
    env_file: [.env]
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN}
    volumes:
      - rspamd-data:/var/lib/rspamd
      - rspamd-dkim:/etc/rspamd/dkim
    networks: [intnet]

  ##########################
  # 8. TRAEFIK (HTTPS via Let's Encrypt)
  ##########################
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # File provider pour le cert auto-signé fallback (cf docker/traefik/)
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Cert resolver LE : marche uniquement si le domaine est joignable
      # depuis internet (port 80 ouvert + DNS public). Si LE échoue, Traefik
      # tombe sur le cert par défaut (auto-signé) défini dans dynamic/tls.yml.
      - --certificatesresolvers.le.acme.email=${ADMIN_EMAIL}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme
      # Cert auto-signé fallback (généré par install.sh si LE pas dispo).
      # Sert pour les déploiements en LAN, IP locale sans NAT, ou tests.
      - ./docker/traefik:/etc/traefik/dynamic:ro
    networks: [intnet]

networks:
  intnet:
    driver: bridge

volumes:
  pg-data:
  redis-data:
  minio-data:
  postfix-data:
  postfix-tls:
  postfix-dkim:
  vmail:
  dovecot-tls:
  rspamd-data:
  rspamd-dkim:
  traefik-acme:
  web-storage:
